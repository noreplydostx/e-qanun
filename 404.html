<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Yönləndirilir...</title>
  <script>
    // URL yolunu analiz edirik
    const path = window.location.pathname;
    const parts = path.split('/').filter(Boolean);
    
    // Əgər istifadəçi /framework/227 kimi bir ünvana giribsə:
    const frameworkIndex = parts.indexOf('framework');
    if (frameworkIndex !== -1 && parts[frameworkIndex + 1]) {
      const id = parts[frameworkIndex + 1];
      // Parametrli ünvana yönləndiririk: /framework/?id=227
      window.location.replace('/framework/?id=' + id);
    } else {
      // Başqa səhv keçid olarsa ana səhifəyə qaytarırıq
      window.location.replace('/');
    }
  </script>
</head>
<body>
</body>
</html>
