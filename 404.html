<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <script>
    // Custom domain üçün sadələşdirilmiş 404 router
    const path = window.location.pathname;
    const parts = path.split('/').filter(Boolean);
    
    const frameworkIndex = parts.indexOf('framework');
    if (frameworkIndex !== -1 && parts[frameworkIndex + 1]) {
      const id = parts[frameworkIndex + 1];
      window.location.replace('/framework/?id=' + id);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
</body>
</html>
