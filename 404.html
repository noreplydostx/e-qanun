<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <script>
    var path = window.location.pathname;
    var parts = path.split('/').filter(Boolean);
    
    var frameworkIndex = parts.indexOf('framework');
    if (frameworkIndex !== -1 && parts[frameworkIndex + 1]) {
      var id = parts[frameworkIndex + 1];
      window.location.replace('/framework/?id=' + id);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
</body>
</html>
