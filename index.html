<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-QANUN | Mərkəzləşdirilmiş Qanunvericilik Bazası</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 12px 24px -4px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg); 
      color: var(--text-main); 
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #fff;
      padding: 70px 20px 90px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #94a3b8;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: -40px auto 60px auto;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    /* Böyüdülmüş Modern Axtarış Qutusu */
    .search-box {
      background: var(--surface);
      padding: 14px 20px 14px 24px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s ease;
      min-height: 64px;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.15), 0 20px 30px -10px rgba(15, 23, 42, 0.12);
    }

    .search-icon {
      width: 26px;
      height: 26px;
      stroke: var(--primary);
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 17px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text-main);
      background: transparent;
    }

    .search-box input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .doc-list {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .doc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .doc-card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .doc-main {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .doc-index {
      width: 38px;
      height: 38px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .doc-card:hover .doc-index {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #bfdbfe;
    }

    .doc-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }

    .doc-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .doc-badge {
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid #e2e8f0;
    }

    .btn-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f8fafc;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .doc-card:hover .btn-arrow {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateX(3px);
    }

    .status-msg {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-size: 15px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-container">
      <div class="brand-tag">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        E-QANUN PORTALI
      </div>
      <h1>Qanunvericilik Bazası</h1>
      <p>Normativ hüquqi aktların müasir axtarış və baxış sistemi</p>
    </div>
  </header>

  <div class="container">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Sənədin adı, nömrəsi və ya tarixi ilə axtarın...">
    </div>

    <div id="documentList" class="doc-list"></div>
  </div>

  <script>
    const allDocuments = [
      {
        id: "226",
        no: "226",
        title: "“Süni intellektin inkişafı üçün milli prioritet sektorların və müvafiq sektor üzrə məsul dövlət orqanlarının (qurumlarının) siyahısı”nın təsdiq edilməsi haqqında",
        date: "21 iyul 2026"
      }
    ];

    {
    id: "100",
    no: "100",
    title: "Yeni Qanun və ya Qərarın Tam Adı",
    date: "25 iyul 2026"
  }
];
    
    function renderDocuments(docs) {
      const container = document.getElementById('documentList');
      container.innerHTML = '';

      if (!docs || docs.length === 0) {
        container.innerHTML = '<div class="status-msg">Axtarışa uyğun heç bir rəsmi sənəd tapılmadı.</div>';
        return;
      }

      docs.forEach(function(doc, index) {
        const docUrl = 'framework/' + doc.id;
        const docNo = doc.no ? '<span class="doc-badge">№ ' + doc.no + '</span>' : '';

        const item = document.createElement('a');
        item.href = docUrl;
        item.className = 'doc-card';
        item.innerHTML = 
          '<div class="doc-main">' +
            '<div class="doc-index">' + (index + 1) + '</div>' +
            '<div class="doc-details">' +
              '<div class="doc-title">' + doc.title + '</div>' +
              '<div class="doc-meta">' +
                docNo +
                '<span>Qəbul tarixi: ' + doc.date + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="btn-arrow">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
          '</div>';

        container.appendChild(item);
      });
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      const filtered = allDocuments.filter(function(doc) {
        return (doc.title && doc.title.toLowerCase().indexOf(query) !== -1) ||
               (doc.no && doc.no.toLowerCase().indexOf(query) !== -1) ||
               (doc.date && doc.date.toLowerCase().indexOf(query) !== -1);
      });
      renderDocuments(filtered);
    });

    renderDocuments(allDocuments);
  </script>
</body>
</html>
