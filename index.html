<!-- Mərkəzləşdirilmiş sənəd bazası -->
  <script src="/documents.js"></script>

  <script>
    function renderDocuments(docs) {
      const container = document.getElementById('documentList');
      container.innerHTML = '';

      if (!docs || docs.length === 0) {
        container.innerHTML = '<div class="status-msg">Axtarışa uyğun heç bir rəsmi sənəd tapılmadı.</div>';
        return;
      }

      docs.forEach(function(doc, index) {
        const docUrl = '/framework/' + doc.id;
        const docNo = doc.no ? '<span class="doc-badge">№ ' + doc.no + '</span>' : '';

        const item = document.createElement('a');
        item.href = docUrl;
        item.className = 'doc-card';
        item.innerHTML = 
          '<div class="doc-main">' +
            '<div class="doc-index">' + (index + 1) + '</div>' +
            '<div class="doc-details">' +
              '<div class="doc-title">' + doc.title + '</div>' +
              '<div class="doc-meta">' +
                docNo +
                '<span>Qəbul tarixi: ' + doc.date + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="btn-arrow">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
          '</div>';

        container.appendChild(item);
      });
    }

    // Axtarış funksiyası
    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      const filtered = ALL_DOCUMENTS.filter(function(doc) {
        return (doc.title && doc.title.toLowerCase().indexOf(query) !== -1) ||
               (doc.no && doc.no.toLowerCase().indexOf(query) !== -1) ||
               (doc.date && doc.date.toLowerCase().indexOf(query) !== -1);
      });
      renderDocuments(filtered);
    });

    // Səhifə yüklənəndə avtomatik siyahını ekrana çıxarır
    renderDocuments(ALL_DOCUMENTS);
  </script>
