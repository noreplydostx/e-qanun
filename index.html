<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-QANUN | Rəsmi Sənədlər Portal</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border-color: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    .search-box {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background: var(--card-bg);
      box-sizing: border-box;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: var(--primary);
    }
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .doc-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .doc-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05);
    }
    .doc-main {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .doc-index {
      font-weight: 600;
      color: var(--text-muted);
      min-width: 24px;
    }
    .doc-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .doc-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .doc-badge {
      background: #eff6ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .btn-arrow {
      color: var(--text-muted);
    }
    .status-msg {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>E-QANUN Portalı</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Sənəd adı, nömrəsi və ya tarixinə görə axtar...">
    <div id="documentList" class="doc-list"></div>
  </div>

  <script src="./documents.js"></script>
  <script>
    function initPortal() {
      var container = document.getElementById('documentList');
      if (!container) return;

      var docs = window.ALL_DOCUMENTS || [];

      function render(items) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<div class="status-msg">Axtarışa uyğun sənəd tapılmadı.</div>';
          return;
        }

        for (var i = 0; i < items.length; i++) {
          var doc = items[i];
          var docUrl = '/framework/' + doc.id;
          var docNo = doc.no ? '<span class="doc-badge">№ ' + doc.no + '</span>' : '';

          var a = document.createElement('a');
          a.href = docUrl;
          a.className = 'doc-card';
          a.innerHTML = 
            '<div class="doc-main">' +
              '<div class="doc-index">' + (i + 1) + '</div>' +
              '<div>' +
                '<div class="doc-title">' + doc.title + '</div>' +
                '<div class="doc-meta">' + docNo + '<span>Tarix: ' + doc.date + '</span></div>' +
              '</div>' +
            '</div>' +
            '<div class="btn-arrow">➔</div>';

          container.appendChild(a);
        }
      }

      render(docs);

      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          var query = this.value.toLowerCase().trim();
          var filtered = docs.filter(function(doc) {
            return (doc.title && doc.title.toLowerCase().indexOf(query) !== -1) ||
                   (doc.no && doc.no.toLowerCase().indexOf(query) !== -1) ||
                   (doc.date && doc.date.toLowerCase().indexOf(query) !== -1);
          });
          render(filtered);
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPortal);
    } else {
      initPortal();
    }
  </script>
</body>
</html>
