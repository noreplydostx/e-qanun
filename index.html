<!-- Mərkəzləşdirilmiş sənəd bazası -->
  <script src="./documents.js"></script>

  <script>
    function initPortal() {
      var container = document.getElementById('documentList');
      if (!container) return;

      var docs = window.ALL_DOCUMENTS || [];

      function render(items) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<div class="status-msg">Sənəd tapılmadı.</div>';
          return;
        }

        for (var i = 0; i < items.length; i++) {
          var doc = items[i];
          var docUrl = '/framework/' + doc.id;
          var docNo = doc.no ? '<span class="doc-badge">№ ' + doc.no + '</span>' : '';

          var a = document.createElement('a');
          a.href = docUrl;
          a.className = 'doc-card';
          a.innerHTML = 
            '<div class="doc-main">' +
              '<div class="doc-index">' + (i + 1) + '</div>' +
              '<div class="doc-details">' +
                '<div class="doc-title">' + doc.title + '</div>' +
                '<div class="doc-meta">' +
                  docNo +
                  '<span>Qəbul tarixi: ' + doc.date + '</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="btn-arrow">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
            '</div>';

          container.appendChild(a);
        }
      }

      // İlk yüklənmə
      render(docs);

      // Axtarış
      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          var query = this.value.toLowerCase().trim();
          var filtered = docs.filter(function(doc) {
            return (doc.title && doc.title.toLowerCase().indexOf(query) !== -1) ||
                   (doc.no && doc.no.toLowerCase().indexOf(query) !== -1);
          });
          render(filtered);
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPortal);
    } else {
      initPortal();
    }
  </script>
