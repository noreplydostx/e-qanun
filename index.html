<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hüquqi Aktlar Portalı</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; }
    header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #fff; padding: 45px 20px; text-align: center; }
    header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    header p { color: #94a3b8; font-size: 15px; }
    .container { max-width: 850px; margin: -25px auto 50px auto; padding: 0 20px; }
    .search-card { background: var(--card-bg); padding: 8px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .search-input-wrapper input { width: 100%; padding: 14px 16px; font-size: 16px; border: none; outline: none; font-family: inherit; }
    .doc-list { display: flex; flex-direction: column; gap: 16px; }
    .doc-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; transition: all 0.2s; }
    .doc-card:hover { transform: translateY(-2px); border-color: #cbd5e1; }
    .doc-title { font-size: 16px; font-weight: 600; }
    .doc-meta { display: flex; gap: 10px; font-size: 13px; color: var(--text-muted); margin-top: 6px; }
    .doc-badge { background: #f1f5f9; color: var(--primary); font-weight: 600; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .btn-view { background: #eff6ff; color: var(--primary); padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .doc-card:hover .btn-view { background: var(--primary); color: #fff; }
    .status-msg { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>Qanunvericilik Bazası</h1>
    <p>Azərbaycan Respublikasının rəsmi hüquqi aktlar portalı</p>
  </header>

  <div class="container">
    <div class="search-card">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" onkeyup="filterDocs()" placeholder="Sənədin adı, nömrəsi və ya tarixi ilə axtarın...">
      </div>
    </div>
    <div id="documentList" class="doc-list">
      <div class="status-msg">Sənədlər yüklənir...</div>
    </div>
  </div>

  <script>
    let allDocuments = [];

    fetch('./documents.json')
      .then(response => response.json())
      .then(data => {
        allDocuments = data;
        renderDocuments(allDocuments);
      })
      .catch(error => {
        document.getElementById('documentList').innerHTML = '<div class="status-msg" style="color:#ef4444;">Sənədlər yüklənərkən xəta baş verdi.</div>';
      });

    function renderDocuments(docs) {
      const container = document.getElementById('documentList');
      container.innerHTML = '';

      if (docs.length === 0) {
        container.innerHTML = '<div class="status-msg">Heç bir sənəd tapılmadı.</div>';
        return;
      }

      docs.forEach(doc => {
        // DÜZƏLİŞ: Birbaşa framework/1.html faylına yönləndirir
        const docUrl = `./framework/${doc.id}.html`;
        const docNo = doc.no ? `<span class="doc-badge">№ ${doc.no}</span>` : '';

        const item = document.createElement('a');
        item.href = docUrl;
        item.className = 'doc-card';
        item.innerHTML = `
          <div>
            <div class="doc-title">${doc.title}</div>
            <div class="doc-meta">
              ${docNo}
              <span>Qəbul tarixi: ${doc.date}</span>
            </div>
          </div>
          <div class="btn-view">Sənədə Bax &rarr;</div>
        `;
        container.appendChild(item);
      });
    }

    function filterDocs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allDocuments.filter(doc => {
        return doc.title.toLowerCase().includes(query) ||
               (doc.no && doc.no.toLowerCase().includes(query)) ||
               (doc.date && doc.date.toLowerCase().includes(query));
      });
      renderDocuments(filtered);
    }
  </script>
</body>
</html>
