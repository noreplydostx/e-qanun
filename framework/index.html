<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sənəd | E-QANUN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-focus: #2563eb;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #2563eb;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #111827;
      --border: #1e293b;
      --border-focus: #3b82f6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
    }

    .wrapper {
      width: 100%;
      max-width: 800px;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--accent);
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--border-focus);
    }

    .doc-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .doc-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border);
    }

    .doc-authority {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .doc-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .doc-body {
      font-size: 15px;
      line-height: 1.9;
      color: var(--text-primary);
      opacity: 0.9;
      margin-bottom: 50px;
    }

    .paragraph {
      margin-bottom: 20px;
      text-align: justify;
    }

    .doc-footer {
      border-top: 1px solid var(--border);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    .signer-title { 
      color: var(--text-secondary); 
      font-weight: 500;
    }
    
    .signer-name { 
      font-weight: 700; 
      color: var(--text-primary);
      font-size: 15px;
    }

    .doc-location { 
      color: var(--text-secondary); 
      margin-top: 12px;
      font-size: 13px;
    }

    .not-found {
      text-align: center;
      padding: 60px 20px;
    }

    .not-found h2 {
      margin-bottom: 10px;
    }

    .not-found a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>

  <div class="wrapper">
    <div class="top-nav">
      <a href="/" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Ana səhifəyə qayıt
      </a>
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Rejimi dəyiş">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
    
    <div id="docContainer" class="doc-container"></div>
  </div>

  <script src="/documents.js"></script>
  <script>
    function updateThemeIcon() {
      var currentTheme = document.documentElement.getAttribute('data-theme');
      var icon = document.getElementById('themeIcon');
      if (currentTheme === 'dark') {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
      } else {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }
    }

    function toggleTheme() {
      var currentTheme = document.documentElement.getAttribute('data-theme');
      var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon();
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateThemeIcon();
      loadDocument();
    });

    function loadDocument() {
      var container = document.getElementById('docContainer');
      if (!container) return;

      var urlParams = new URLSearchParams(window.location.search);
      var docId = urlParams.get('id');

      if (!docId) {
        var pathParts = window.location.pathname.split('/').filter(Boolean);
        var frameworkIndex = pathParts.indexOf('framework');
        if (frameworkIndex !== -1 && pathParts[frameworkIndex + 1]) {
          docId = pathParts[frameworkIndex + 1];
        }
      }

      var docs = window.ALL_DOCUMENTS || [];
      var currentDoc = null;

      for (var i = 0; i < docs.length; i++) {
        if (docs[i].id === docId) {
          currentDoc = docs[i];
          break;
        }
      }

      if (currentDoc) {
        document.title = currentDoc.title + " | E-QANUN";
        
        var paragraphsHtml = '';
        if (currentDoc.paragraphs) {
          for (var j = 0; j < currentDoc.paragraphs.length; j++) {
            paragraphsHtml += '<p class="paragraph">' + currentDoc.paragraphs[j] + '</p>';
          }
        }

        container.innerHTML = 
          '<div class="doc-header">' +
            '<div class="doc-authority">' + (currentDoc.authority || '') + '</div>' +
            '<h1 class="doc-title">' + currentDoc.title + '</h1>' +
          '</div>' +
          '<div class="doc-body">' + paragraphsHtml + '</div>' +
          '<div class="doc-footer">' +
            '<div class="signer-title">' + (currentDoc.signerTitle || '') + '</div>' +
            '<div class="signer-name">' + (currentDoc.signerName || '') + '</div>' +
            '<div class="doc-location">' + (currentDoc.location || '') + ', ' + (currentDoc.date || '') + '</div>' +
          '</div>';
      } else {
        container.innerHTML = 
          '<div class="not-found">' +
            '<h2>Sənəd tapılmadı</h2>' +
            '<p style="color:var(--text-secondary); margin-bottom:20px;">Axtardığınız hüquqi akt mövcud deyil və ya silinib.</p>' +
            '<a href="/">Ana səhifəyə qayıt</a>' +
          '</div>';
      }
    }
  </script>
</body>
</html>
