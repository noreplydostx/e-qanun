<!-- Mərkəzləşdirilmiş sənəd bazası -->
  <script src="/documents.js"></script>

  <script>
    // URL-dən ID-ni və ya parametri götürürük
    const urlParams = new URLSearchParams(window.location.search);
    let docId = urlParams.get('id');

    if (!docId) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const frameworkIndex = pathParts.indexOf('framework');
      if (frameworkIndex !== -1 && pathParts[frameworkIndex + 1]) {
        docId = pathParts[frameworkIndex + 1];
      }
    }

    // ALL_DOCUMENTS siyahısından həmin ID-yə uyğun sənədi tapırıq
    const currentDoc = ALL_DOCUMENTS.find(doc => doc.id === docId);

    if (currentDoc) {
      document.title = currentDoc.title + " | E-QANUN";
      
      const contentHtml = `
        <div class="doc-header">
          <div class="doc-authority">${currentDoc.authority || ''}</div>
          <h1 class="doc-title">${currentDoc.title}</h1>
        </div>
        
        <div class="doc-body">
          ${currentDoc.paragraphs.map(p => `<p class="paragraph">${p}</p>`).join('')}
        </div>

        <div class="doc-footer">
          <div class="signer-title">${currentDoc.signerTitle || ''}</div>
          <div class="signer-name">${currentDoc.signerName || ''}</div>
          <div class="doc-location">${currentDoc.location || ''}, ${currentDoc.date || ''}</div>
        </div>
      `;
      
      document.getElementById('docContainer').innerHTML = contentHtml;
    } else {
      document.getElementById('docContainer').innerHTML = `
        <div style="text-align:center; padding: 50px;">
          <h2>Sənəd tapılmadı</h2>
          <p style="color:#64748b; margin-top:10px;">Axtardığınız ID ilə sənəd bazada mövcut deyil.</p>
          <a href="/" style="display:inline-block; margin-top:20px; color:#2563eb;">Ana səhifəyə qayıt</a>
        </div>
      `;
    }
  </script>
