<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sənədə Baxış | E-QANUN</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 20px;
      --shadow-md: 0 12px 32px -4px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg); 
      color: var(--text-main); 
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-2px);
    }

    .back-btn svg { width: 16px; height: 16px; }

    .container {
      max-width: 900px;
      margin: 40px auto 80px auto;
      padding: 0 20px;
    }

    .doc-paper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 56px 64px;
      box-shadow: var(--shadow-md);
    }

    /* Rəsmi Sənəd Formatı */
    .doc-header-block {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid #f1f5f9;
    }

    .doc-type-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      background: #eff6ff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .doc-main-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .doc-authority {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .doc-body-text {
      font-size: 15px;
      color: #334155;
      text-align: justify;
    }

    .doc-paragraph {
      text-indent: 30px;
      margin-bottom: 18px;
    }

    .doc-signature-block {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-signer-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .doc-signer-title {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .doc-footer-meta {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .status-msg { text-align: center; padding: 60px; color: var(--text-muted); }

    @media (max-width: 640px) {
      .doc-paper { padding: 32px 24px; }
      .doc-main-title { font-size: 17px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="../" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Ana səhifəyə qayıt
      </a>
    </div>
  </header>

  <div class="container">
    <main class="doc-paper">
      <div id="documentContent"></div>
    </main>
  </div>

  <script>
    const documentsData = {
      "226": {
        no: "226",
        title: "“Dostlarstan Respublikası dövlətinin bərpası haqqında",
        authority: "DOSTLARSTAN RESPUBLİKASININ QƏRARI",
        paragraphs: [
          "Dostlarstan Respublikasının 2018-ci ildə Aslan Aslanov tərəfindən əsası qoyulmuş dövlətçilik ənənələrini, tarixi ədalətin bərqərar edilməsini, xalqın suveren iradəsini və öz müqəddəratını təyin etmək hüququnu rəhbər tutaraq, Dostlarstan dövləti bərpa olunur və dövlət qərara alır:",
          "1.	Dostlarstan Respublikasının 2018-ci ildən başlanan müstəqil dövlətçiliyi və suverenliyi bərpa edilsin.
2.	Dövlət hakimiyyəti, idarəetmə strukturları və təsisatları yenidən təşkil olunsun.
3.	Dostlarstan Respublikasının bərpası agentliyi yaradılsın.
4.	Bu Qərar qəbul edildiyi gündən qüvvəyə minir.
"
        ],
        signerName: "Əli ƏSƏDOV",
        signerTitle: "Azərbaycan Respublikasının Baş naziri",
        location: "Bakı şəhəri",
        date: "21 iyul 2026-cı il"
      }
    };

    // URL-dən parametr və ya birbaşa ID oxuma
    const urlParams = new URLSearchParams(window.location.search);
    let docId = urlParams.get('id');

    if (!docId) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const frameworkIdx = parts.indexOf('framework');
      if (frameworkIdx !== -1 && parts[frameworkIdx + 1]) {
        docId = parts[frameworkIdx + 1];
      }
    }

    const doc = documentsData[docId];
    const contentDiv = document.getElementById('documentContent');

    if (!docId) {
      contentDiv.innerHTML = '<div class="status-msg" style="color:#ef4444;">Sənəd nömrəsi daxil edilməyib.</div>';
    } else if (doc) {
      document.title = doc.title + ' | E-QANUN';

      let paragraphsHTML = '';
      doc.paragraphs.forEach(p => {
        paragraphsHTML += '<p class="doc-paragraph">' + p + '</p>';
      });

      contentDiv.innerHTML = 
        '<div class="doc-header-block">' +
          '<div class="doc-type-tag">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>' +
            'Rəsmi Qanunvericilik Aktı' +
          '</div>' +
          '<div class="doc-main-title">' + doc.title + '</div>' +
          '<div class="doc-authority">' + doc.authority + '</div>' +
        '</div>' +
        '<div class="doc-body-text">' +
          paragraphsHTML +
        '</div>' +
        '<div class="doc-signature-block">' +
          '<div class="doc-signer-name">' + doc.signerName + '</div>' +
          '<div class="doc-signer-title">' + doc.signerTitle + '</div>' +
        '</div>' +
        '<div class="doc-footer-meta">' +
          '<span>' + doc.location + ', ' + doc.date + '</span>' +
          '<span>№ ' + doc.no + '</span>' +
        '</div>';
    } else {
      contentDiv.innerHTML = '<div class="status-msg" style="color:#ef4444;">ID: "' + docId + '" olan sənəd tapılmadı.</div>';
    }
  </script>

</body>
</html>
