<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sənədə Baxış | E-QANUN</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 20px;
      --shadow-md: 0 12px 32px -4px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg); 
      color: var(--text-main); 
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation Header */
    header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-2px);
    }

    .back-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Document Layout */
    .container {
      max-width: 900px;
      margin: 40px auto 80px auto;
      padding: 0 20px;
    }

    .doc-paper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 56px 64px;
      box-shadow: var(--shadow-md);
    }

    .doc-header {
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 32px;
      margin-bottom: 36px;
      text-align: center;
    }

    .doc-type-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      background: #eff6ff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .doc-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .doc-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .doc-badge {
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .doc-body {
      font-size: 16px;
      color: #334155;
      line-height: 1.85;
      text-align: justify;
    }

    .doc-body p {
      margin-bottom: 20px;
    }

    .status-msg {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .doc-paper { padding: 32px 24px; }
      .doc-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="../" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Ana səhifəyə qayıt
      </a>
    </div>
  </header>

  <div class="container">
    <main class="doc-paper">
      <div id="documentContent"></div>
    </main>
  </div>

  <script>
    const documentsData = {
      "1": {
        no: "AK-102",
        title: "Azərbaycan Respublikasının Konstitusiyası",
        date: "12 noyabr 1995",
        content: "Azərbaycan xalqı öz çoxəsrlik dövlətçilik ənənələrini davam etdirərək, bütün cəmiyyətin və hər kəsin rifahının təmin edilməsini istəyərək, ədalətin, azadlığın və təhlükəsizliyin bərqərar edilməsini arzulayaraq bu Konstitusiyanı qəbul edir."
      },
      "2": {
        no: "482",
        title: "R.A.Abbasovun 2-ci dərəcəli ordenlə təltif edilməsi haqqında",
        date: "22 iyul 2026",
        content: "Azərbaycan Respublikasında dövlət qulluğunda səmərəli fəaliyyətinə görə Rəşad Adil oğlu Abbasov 2-ci dərəcəli 'Vətənə xidmətə görə' ordeni ilə təltif edilsin."
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('id');
    const doc = documentsData[docId];

    const contentDiv = document.getElementById('documentContent');

    if (!docId) {
      contentDiv.innerHTML = '<div class="status-msg" style="color:#ef4444;">Sənəd nömrəsi təyin edilməyib.</div>';
    } else if (doc) {
      document.title = doc.title + ' | E-QANUN';
      const docNo = doc.no ? '<span class="doc-badge">№ ' + doc.no + '</span>' : '';

      contentDiv.innerHTML = 
        '<div class="doc-header">' +
          '<div class="doc-type-tag">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>' +
            'Rəsmi Qanunvericilik Aktı' +
          '</div>' +
          '<h1 class="doc-title">' + doc.title + '</h1>' +
          '<div class="doc-meta">' +
            docNo +
            '<span>Qəbul tarixi: <strong>' + doc.date + '</strong></span>' +
          '</div>' +
        '</div>' +
        '<div class="doc-body">' +
          '<p><strong>AZƏRBAYCAN RESPUBLİKASININ QANUNU</strong></p>' +
          '<p>' + doc.content + '</p>' +
        '</div>';
    } else {
      contentDiv.innerHTML = '<div class="status-msg" style="color:#ef4444;">Daxil edilən ID üzrə sənəd tapılmadı.</div>';
    }
  </script>

</body>
</html>
