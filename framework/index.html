<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sənədə Baxış | E-QANUN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gov-navy: #0a192f;
      --gov-blue: #1e40af;
      --gov-light-blue: #eff6ff;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

    .gov-top-bar { background: #020617; color: #94a3b8; font-size: 12px; padding: 6px 20px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }
    .gov-flag-text { display: flex; align-items: center; gap: 8px; }
    .gov-flag-icon { width: 14px; height: 10px; background: linear-gradient(to bottom, #00bfff 33.3%, #ff0000 33.3%, #ff0000 66.6%, #008000 66.6%); border-radius: 1px; display: inline-block; }

    header { background: var(--gov-navy); border-bottom: 3px solid var(--gov-blue); padding: 14px 20px; }
    .header-container { max-width: 950px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    
    .back-btn { text-decoration: none; color: #f8fafc; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.08); border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); transition: all 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.18); }

    .btn-print { background: var(--gov-blue); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-print:hover { background: #1d4ed8; }

    .container { max-width: 950px; margin: 30px auto 60px auto; padding: 0 20px; }

    .doc-paper { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    
    .doc-header-block { border-bottom: 2px solid #e2e8f0; padding-bottom: 24px; margin-bottom: 30px; text-align: center; }
    .doc-emblem { font-size: 12px; font-weight: 700; color: var(--gov-blue); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
    .doc-title { font-size: 22px; font-weight: 700; color: var(--gov-navy); line-height: 1.4; margin-bottom: 16px; }
    
    .doc-meta-row { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); }
    .doc-badge { background: var(--gov-light-blue); color: var(--gov-blue); font-weight: 600; padding: 3px 10px; border-radius: 4px; border: 1px solid #bfdbfe; }

    .doc-body-text { font-size: 15px; color: #1e293b; line-height: 1.8; text-align: justify; }
    .doc-body-text p { margin-bottom: 16px; }

    .status-msg { text-align: center; padding: 60px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="gov-top-bar">
    <div class="gov-flag-text">
      <span class="gov-flag-icon"></span>
      <span>AZƏRBAYCAN RESPUBLİKASININ RƏSMİ HÜQUQİ PORTALI</span>
    </div>
    <span>E-QANUN SƏNƏD REYESTRİ</span>
  </div>

  <header>
    <div class="header-container">
      <a href="../" class="back-btn">&larr; Ana Səhifəyə Qayıt</a>
      <button class="btn-print" onclick="window.print()">🖨️ Çap Versiyası</button>
    </div>
  </header>

  <div class="container">
    <main class="doc-paper">
      <div id="documentContent"></div>
    </main>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('id');

    // Məlumatları təhlükəsiz massivdən oxuyuruq
    const defaultDocs = [
      {
        id: "1",
        no: "AK-102",
        title: "Azərbaycan Respublikasının Konstitusiyası",
        date: "12 noyabr 1995",
        content: "Azərbaycan xalqı öz çoxəsrlik dövlətçilik ənənələrini davam etdirərək, bütün cəmiyyətin və hər kəsin rifahının təmin edilməsini istəyərək, ədalətin, azadlığın və təhlükəsizliyin bərqərar edilməsini arzulayaraq bu Konstitusiyanı qəbul edir."
      },
      {
        id: "2",
        no: "482",
        title: "R.A.Abbasovun 2-ci dərəcəli ordenlə təltif edilməsi haqqında",
        date: "22 iyul 2026",
        content: "Azərbaycan Respublikasında dövlət qulluğunda səmərəli fəaliyyətinə görə Rəşad Adil oğlu Abbasov 2-ci dərəcəli 'Vətənə xidmətə görə' ordeni ilə təltif edilsin."
      }
    ];

    const storedDocs = JSON.parse(localStorage.getItem('eqanun_docs')) || defaultDocs;
    const doc = storedDocs.find(d => String(d.id) === String(docId));

    if (!docId) {
      document.getElementById('documentContent').innerHTML = '<div class="status-msg" style="color:#dc2626;">Sənəd reyestr nömrəsi (ID) seçilməyib.</div>';
    } else if (doc) {
      document.title = `${doc.title} | E-QANUN`;
      const docNo = doc.no ? `<span class="doc-badge">№ ${doc.no}</span>` : '';

      document.getElementById('documentContent').innerHTML = `
        <div class="doc-header-block">
          <div class="doc-emblem">Azərbaycan Respublikasının Qanunvericiliyi</div>
          <h1 class="doc-title">${doc.title}</h1>
          <div class="doc-meta-row">
            ${docNo}
            <span>Qəbul tarixi: <strong>${doc.date}</strong></span>
          </div>
        </div>
        <div class="doc-body-text">
          <p><strong>AZƏRBAYCAN RESPUBLİKASININ QANUNU</strong></p>
          <p>${doc.content}</p>
        </div>
      `;
    } else {
      document.getElementById('documentContent').innerHTML = `<div class="status-msg" style="color:#dc2626;">ID: "${docId}" olan sənəd tapılmadı.</div>`;
    }
  </script>

</body>
</html>
